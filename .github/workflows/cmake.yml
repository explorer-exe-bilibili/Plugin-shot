# ============================================================================
#  GitHub Actions — 跨平台构建（CMake presets + vcpkg 清单模式 + Ninja）
#
#  结构参考 random_name/.github/workflows/Cmake.yml，按本仓库（CMake >= 3.21、
#  vcpkg 清单模式、Ninja、插件工程、Windows-first）简化。
#
#  ── 已验证的平台 / 配置 ────────────────────────────────────────────────
#   [x] Linux   ubuntu-latest  / GCC        / x64-linux   / Ninja / Release
#       在 WSL Ubuntu 24.04 + GCC 13.3（与 ubuntu-latest 等价工具链）实测通过：
#         configure ✅  build ✅（宿主 + settings_ui/image_saver/example_processor/
#         opencv_provider 全部产出 .so）  `Plugin-shot --help` ✅（exit 0）
#         无头 `Plugin-shot --capture` ✅ 验证到 dlopen 加载 4 个插件、
#         贴尾 metadata 解析、OpenCV provider 报 4.12.0、事件总线/退出路径。
#         另外用 `git archive HEAD` 在 ext4 上按本 workflow 的 preset 流程
#         （干净 checkout + `cmake --preset release` + `cmake --build --preset
#         release`）重跑了一遍以模拟真实 CI：configure/build/--help 全绿。
#         该模拟顺带抓到并修复了 NTFS 大小写不敏感掩盖的 include 大小写问题
#         （git 跟踪名 include/PluginManager.h → include/pluginManager.h，
#          否则 Linux ext4 上 #include "pluginManager.h" 找不到、宿主一半 TU 编不过）。
#       （screen_capture/tray/clipboard/hotkey/region_selector 是 Windows 实现，
#        非 Windows 由各自 CMakeLists 主动跳过，不产出伪实现。）
#   [ ] macOS   macos-latest   / AppleClang / arm64-osx   / Ninja / Release
#       仅完成代码级跨平台修复（base.cpp 的 _NSGetExecutablePath 分支等）；
#       GitHub Actions 尚未实际跑到该 job，等账号恢复后由本 workflow 验证。
#   [x] Windows windows-latest / MSVC       / x64-windows / Ninja / Release
#       本地 Windows（VS2022 MSVC + Ninja + vcpkg x64-windows 依赖）在隔离目录
#       build/ci-verify-win 回归构建通过：宿主 + settings_ui/image_saver/
#       example_processor/opencv_provider 全部编译链接成功，0 警告 0 错误。
#       本 workflow 的 Windows job 保留在矩阵里，非"必须绿"（Linux + macOS 是准入门槛）。
#
#  ⚠ 账号状态备注：写下这段时，仓库所属账号的 GitHub Actions 被 billing 锁定，
#    job 无法启动（Windows/Linux 立即失败、macOS 排队数分钟后同样失败），注解为
#    "The job was not started because your account is locked due to a billing
#    issue."（不是 workflow 语法问题）。账号解锁后推一次 / workflow_dispatch
#    即可得到真实 CI 结果；Linux 的结论来自本地 WSL 完整构建 + ext4 干净
#    checkout 的 preset 流程模拟，步骤与下面 workflow 一一对应。
#
#  ── 构建约定 ────────────────────────────────────────────────────────────
#   · 配置：`cmake --preset release`，产物目录 build/<hostSystemName>（Linux /
#     Darwin / Windows），即 build/<platform>/bin/Plugin-shot[.exe]。
#   · vcpkg：清单模式，baseline 见 vcpkg-configuration.json。CI 里 clone 一份
#     vcpkg 到 $VCPKG_ROOT 并 bootstrap，preset 用 $env{VCPKG_ROOT} 找工具链；
#     依赖产物与源码下载目录用 actions/cache 缓存（命中后 configure 几乎瞬时）。
#   · 冒烟：无头执行 `Plugin-shot --help`（在打开日志/插件/GUI 之前就返回，
#     所以 Linux/macOS runner 不需要 X server / 显示器）。
#   · 产物上传：三平台构建成功后把 build/<platform>/bin/ 打成 zip 上传
#     （artifact：plugin-shot-<platform>-release，保留 7 天）；Windows 另跑
#     宿主便携包脚本 + package_sdk，把 dist/ 里的 zip 与 .sha256 一起上传
#     （artifact：plugin-shot-windows-dist-<版本>）。
#   · Linux 系统依赖：X11/OpenGL（glfw3 端口编译需要）+ autotools 工具链
#     （vcpkg 用 autotools 构建 dbus/libxcrypt 等）。nativefiledialog-extended 的
#     vcpkg 端口在 Linux 用 NFD_PORTAL=ON（dbus 由 vcpkg 源码构建），所以
#     libgtk-3-dev/libdbus-1-dev 不是必装项。清单按实际报错逐条补齐。
#
#  ── 可选裁剪（OpenCV 让 CI 太慢时）─────────────────────────────────────
#   在 configure 步骤追加 -DSHOT_ENABLE_OPENCV=OFF 可跳过依赖 OpenCV 的插件
#   （opencv_provider / example_processor；默认 ON，本地构建行为不变）。
#   注意：vcpkg 清单里的 opencv4 仍会安装（清单模式不支持按选项剔除依赖），
#   该开关只裁剪插件目标的编译/链接。
# ============================================================================
name: CMake CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    strategy:
      # 一个平台失败不取消其它平台：CI 结果要能同时看到 Linux/macOS/Windows。
      fail-fast: false
      matrix:
        include:
          - name: Linux / gcc / x64-linux
            os: ubuntu-24.04
            platform: Linux
            triplet: x64-linux
          - name: macOS / clang / arm64-osx
            os: macos-latest
            platform: Darwin
            triplet: arm64-osx
          - name: Windows / msvc / x64-windows
            os: windows-latest
            platform: Windows
            triplet: x64-windows

    env:
      # preset（CMakePresets.json）用 $env{VCPKG_ROOT} 拼 vcpkg 工具链路径。
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DISABLE_METRICS: "1"
      # 源码构建 OpenCV 时限制并发，避免 runner 内存被并行的编译单元吃满。
      VCPKG_MAX_CONCURRENCY: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      #  1. 系统依赖
      # ---------------------------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          # 说明（按 WSL Ubuntu 24.04 + GCC13 实际构建报错逐条补齐）：
          #  · autoconf/autoconf-archive/automake/libtool/libltdl-dev/bison/flex/gperf/
          #    gettext/autopoint —— vcpkg 用 autotools 构建的移植依赖（dbus/libxcrypt 等）；
          #  · python3-venv —— libsystemd 端口在 configure 阶段要建 venv；
          #  · X11/OpenGL dev 库 —— glfw3 端口编译需要（X11/Xrandr/Xinerama/Xcursor/Xi/
          #    Xext/xkbcommon/wayland）；
          #  · libportal/pipewire/glib/notify —— Linux 插件（Wayland 采集走 ScreenCast
          #    门户 + PipeWire；session_control 用 GIO/GDBus；notify 用 libnotify）；
          #  · nasm/yasm —— libjpeg-turbo 的 SIMD 汇编；
          #  · nativefiledialog-extended 的 vcpkg 端口在 Linux 用 NFD_PORTAL=ON，
          #    依赖由 vcpkg 自己源码构建的 dbus，所以系统 libgtk-3-dev/libdbus-1-dev
          #    实际上不是必装项（装了也无害）。
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config git curl zip unzip tar \
            autoconf autoconf-archive automake libtool libtool-bin libltdl-dev \
            bison flex gperf gettext autopoint python3-venv \
            nasm yasm \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxfixes-dev libxcomposite-dev libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev libxi-dev \
            libxkbcommon-dev libwayland-dev \
            libselinux1-dev libpam0g-dev \
            libportal-dev libpipewire-0.3-dev libspa-0.2-dev \
            libglib2.0-dev libnotify-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # macOS runner 自带 Clang / CMake；Ninja 缺失时补装。
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # preset 用 Ninja；Windows runner 通常自带，缺失时补装（Chocolatey 预装）。
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          ninja --version

      # ---------------------------------------------------------------------
      #  2. vcpkg（清单模式的底层工具）：clone 到 $VCPKG_ROOT 并 bootstrap。
      #     必须在 manifest install 之前完成，否则工具链文件不存在。
      # ---------------------------------------------------------------------
      - name: Set up vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          if [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            rm -rf "$VCPKG_ROOT"
            # 注意：不要 --depth 1 —— vcpkg 需要用 vcpkg-configuration.json 里的
            # builtin-baseline 提交号（历次 master 上的提交），浅克隆里可能没有。
            git clone --quiet https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          "$VCPKG_ROOT/vcpkg" version

      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            Remove-Item -Recurse -Force "$env:VCPKG_ROOT" -ErrorAction SilentlyContinue
            git clone --quiet https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$env:VCPKG_ROOT/vcpkg.exe" version

      # ---------------------------------------------------------------------
      #  3. 缓存：已安装依赖 + 源码下载目录（放在 vcpkg 就绪之后恢复，
      #     这样 downloads 目录不会挡住 clone）。
      # ---------------------------------------------------------------------
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.platform }}/vcpkg_installed
            ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-v1-

      # ---------------------------------------------------------------------
      #  4. 配置 + 构建（Release，Ninja）
      # ---------------------------------------------------------------------
      - name: Configure (CMake preset release)
        shell: bash
        run: |
          cmake --preset release -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET"

      - name: Build
        shell: bash
        # 显式开并行：Ninja 默认用满 CPU 核数，但经 CMake preset 调构建时
        # 某些环境/生成器可能退化成串行；--parallel（不写数字）交给构建
        # 工具用原生并发，三平台统一走多线程编译。
        run: |
          cmake --build --preset release --parallel

      # ---------------------------------------------------------------------
      #  5. 冒烟测试：--help 在 GUI/插件/日志初始化之前返回，可无头执行。
      # ---------------------------------------------------------------------
      - name: Smoke test (Plugin-shot --help)
        shell: bash
        run: |
          set -eux
          BIN="build/${{ matrix.platform }}/bin"
          ls -la "$BIN"
          if [ -d "$BIN/plugins" ]; then ls -la "$BIN/plugins"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$BIN/Plugin-shot.exe" --help
          else
            "./$BIN/Plugin-shot" --help
          fi

      # ---------------------------------------------------------------------
      #  6. 版本号：只用于发布物料命名。从 build 目录的 CMakeCache.txt 读
      #     CMAKE_PROJECT_VERSION（根 CMakeLists 的 project(... VERSION ...) 写入；
      #     它落盘是 :STATIC/内部类型，`cmake -LA -N` 列不出来，所以直接读文件）。
      #     读不到回退 0.1.0——以后改版本只改 CMakeLists.txt，CI 不用跟着改。
      # ---------------------------------------------------------------------
      - name: Resolve project version (Windows)
        if: runner.os == 'Windows'
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = ''
          $cache = 'build/Windows/CMakeCache.txt'
          if (Test-Path -LiteralPath $cache) {
            $hit = Select-String -LiteralPath $cache -Pattern '^CMAKE_PROJECT_VERSION:[^=]+=(.+)$' |
                   Select-Object -First 1
            if ($null -ne $hit) {
              $ver = $hit.Matches[0].Groups[1].Value.Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($ver)) {
            # 版本只影响发布物料命名，读不到不让 job 死掉。
            $ver = '0.1.0'
            Write-Host '::warning title=version::CMAKE_PROJECT_VERSION 读取失败，回退 0.1.0'
          }
          Write-Host "PROJECT_VERSION=$ver"
          # 直接写 LF：artifact 名取自这个值，避免 CRLF 的 \r 混进名字
          # （Out-File 在 Windows 上会按 CRLF 写）。
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "value=$ver`n")

      # ---------------------------------------------------------------------
      #  7. 打包编译产物：build/<platform>/bin/ → dist/*.zip
      #     · zip 内保留 bin/ 目录结构（bin/Plugin-shot[.exe]、bin/plugins/、
      #       bin/files/），解压即可看到三个平台一致的布局。
      #     · Linux/macOS 用 runner 自带的 zip；Windows 用 pwsh 自带
      #       Compress-Archive（不引入第三方 action）。
      # ---------------------------------------------------------------------
      - name: Package bin artifact (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM='${{ matrix.platform }}'
          BIN="build/${PLATFORM}/bin"
          ZIP="dist/plugin-shot-${PLATFORM}-release.zip"
          if [ ! -d "$BIN" ]; then
            echo "::error title=package::找不到产物目录 $BIN"
            exit 1
          fi
          mkdir -p dist
          rm -f "$ZIP"
          ZIP_ABS="$(pwd)/${ZIP}"
          # cd 到 build/<platform>/ 再打包 bin/，zip 顶层就是 bin/，不会多出
          # build/<platform>/ 前缀。
          ( cd "build/${PLATFORM}" && zip -q -r "$ZIP_ABS" bin )
          test -s "$ZIP"
          ls -l "$ZIP"

      - name: Package bin artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platform = '${{ matrix.platform }}'
          $bin = "build/$platform/bin"
          if (-not (Test-Path -LiteralPath $bin)) { throw "找不到产物目录 $bin" }
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $zip = "dist/plugin-shot-$platform-release.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          # -Path 指向目录本身（不是 bin\*）：压缩包顶层保留 bin\。
          Compress-Archive -Path $bin -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zip)) { throw "打包失败：$zip 不存在" }
          $item = Get-Item -LiteralPath $zip
          '打包完成：{0}（{1:N2} MB）' -f $item.Name, ($item.Length / 1MB)

      # ---------------------------------------------------------------------
      #  8. Windows 额外产物：宿主便携包 + 离线 SDK 两个 zip（都在 dist/）。
      # ---------------------------------------------------------------------
      - name: Package Windows host portable bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          # 复用本地发布脚本（tools/package/README.md）；-ExecutionPolicy Bypass
          # 规避 runner 上 .ps1 执行策略限制（AGENTS.md §7.15）。
          & pwsh -NoProfile -ExecutionPolicy Bypass `
              -File 'tools/package/make_host_package.ps1' `
              -Version $env:PROJECT_VERSION `
              -BinDir "build/${{ matrix.platform }}/bin" `
              -OutDir 'dist'
          if ($LASTEXITCODE -ne 0) {
            throw "make_host_package.ps1 失败（exit $LASTEXITCODE）"
          }

      - name: Package offline SDK zips (Windows, best-effort)
        if: runner.os == 'Windows'
        # export_sdk 从 vcpkg 安装目录抽运行库/OpenCV 头与导入库；CI 的
        # VCPKG_ROOT 与本地可能不同（AGENTS.md backlog：Windows job 的
        # VCPKG_ROOT 隐患），失败不应拖垮整个 job —— 降级为"没有 SDK 包"，
        # 宿主便携包与 bin zip 照常上传。失败原因在步骤日志里可见。
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cmake --build 'build/Windows' --target package_sdk
          if ($LASTEXITCODE -ne 0) {
            Write-Host ('::warning title=package_sdk 失败降级::export_sdk/package_sdk 依赖 ' +
                        'vcpkg 安装目录，CI 环境下可能找不到；本次跳过 SDK 包，' +
                        '宿主便携包与 bin zip 不受影响。')
            throw "package_sdk 失败（exit $LASTEXITCODE）"
          }

      # ---------------------------------------------------------------------
      #  9. 上传前打印文件清单与大小（artifact 缺文件时先看这一步的日志）。
      # ---------------------------------------------------------------------
      - name: List artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "== dist/ =="
          ls -l dist
          du -h dist/* || true

      - name: List artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist')) { Write-Host 'dist/ 不存在'; exit 0 }
          Write-Host '== dist/ =='
          Get-ChildItem -LiteralPath 'dist' -File |
            Sort-Object Name |
            ForEach-Object { '{0,12:N0} B  {1}' -f $_.Length, $_.Name }

      # ---------------------------------------------------------------------
      # 10. 上传 artifact（保留 7 天）
      #     · 三平台统一：bin/ 的 zip，名字对齐 matrix.platform；
      #     · Windows 额外：dist/ 全部发布物料（宿主便携包 + 2 个 SDK 包 +
      #       各自 .sha256），名字带版本号，便于以后 tag 发布直接取用。
      # ---------------------------------------------------------------------
      - name: Upload bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-shot-${{ matrix.platform }}-release
          path: dist/plugin-shot-${{ matrix.platform }}-release.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows host + SDK packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          # 说明：dist/ 里也包含上一步生成的 bin zip，因此这个 artifact 是
          # "Windows 全部发布物料"的超集（bin zip 会多存一份）；bin zip 仍
          # 单独保留一个 artifact，是为了三平台的命名/内容保持一致。
          name: plugin-shot-windows-dist-${{ steps.version.outputs.value }}
          path: |
            dist/*.zip
            dist/*.sha256
          # package_sdk 是 best-effort：它失败时 dist/ 里仍有宿主包与 bin zip，
          # 所以这里用 warn 而不是 error；真正缺文件会在上面的 List 步骤暴露。
          if-no-files-found: warn
          retention-days: 7
