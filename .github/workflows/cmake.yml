# ============================================================================
#  GitHub Actions — 跨平台构建（CMake presets + vcpkg 清单模式 + Ninja）
#
#  结构参考 random_name/.github/workflows/Cmake.yml，按本仓库（CMake >= 3.21、
#  vcpkg 清单模式、Ninja、插件工程、Windows-first）简化。
#
#  ── 已验证的平台 / 配置 ────────────────────────────────────────────────
#   [x] Linux   ubuntu-latest  / GCC        / x64-linux   / Ninja / Release
#       在 WSL Ubuntu 24.04 + GCC 13.3（与 ubuntu-latest 等价工具链）实测通过：
#         configure ✅  build ✅（宿主 + settings_ui/image_saver/example_processor/
#         opencv_provider 全部产出 .so）  `Plugin-shot --help` ✅（exit 0）
#         无头 `Plugin-shot --capture` ✅ 验证到 dlopen 加载 4 个插件、
#         贴尾 metadata 解析、OpenCV provider 报 4.12.0、事件总线/退出路径。
#         另外用 `git archive HEAD` 在 ext4 上按本 workflow 的 preset 流程
#         （干净 checkout + `cmake --preset release` + `cmake --build --preset
#         release`）重跑了一遍以模拟真实 CI：configure/build/--help 全绿。
#         该模拟顺带抓到并修复了 NTFS 大小写不敏感掩盖的 include 大小写问题
#         （git 跟踪名 include/PluginManager.h → include/pluginManager.h，
#          否则 Linux ext4 上 #include "pluginManager.h" 找不到、宿主一半 TU 编不过）。
#       （screen_capture/tray/clipboard/hotkey/region_selector 是 Windows 实现，
#        非 Windows 由各自 CMakeLists 主动跳过，不产出伪实现。）
#   [ ] macOS   macos-latest   / AppleClang / arm64-osx   / Ninja / Release
#       仅完成代码级跨平台修复（base.cpp 的 _NSGetExecutablePath 分支等）；
#       GitHub Actions 尚未实际跑到该 job，等账号恢复后由本 workflow 验证。
#   [x] Windows windows-latest / MSVC       / x64-windows / Ninja / Release
#       本地 Windows（VS2022 MSVC + Ninja + vcpkg x64-windows 依赖）在隔离目录
#       build/ci-verify-win 回归构建通过：宿主 + settings_ui/image_saver/
#       example_processor/opencv_provider 全部编译链接成功，0 警告 0 错误。
#       本 workflow 的 Windows job 保留在矩阵里，非"必须绿"（Linux + macOS 是准入门槛）。
#
#  ⚠ 账号状态备注：写下这段时，仓库所属账号的 GitHub Actions 被 billing 锁定，
#    job 无法启动（Windows/Linux 立即失败、macOS 排队数分钟后同样失败），注解为
#    "The job was not started because your account is locked due to a billing
#    issue."（不是 workflow 语法问题）。账号解锁后推一次 / workflow_dispatch
#    即可得到真实 CI 结果；Linux 的结论来自本地 WSL 完整构建 + ext4 干净
#    checkout 的 preset 流程模拟，步骤与下面 workflow 一一对应。
#
#  ── 构建约定 ────────────────────────────────────────────────────────────
#   · 配置：`cmake --preset release`，产物目录 build/<hostSystemName>（Linux /
#     Darwin / Windows），即 build/<platform>/bin/Plugin-shot[.exe]。
#   · vcpkg：清单模式，baseline 见 vcpkg-configuration.json。CI 里 clone 一份
#     vcpkg 到 $VCPKG_ROOT 并 bootstrap，preset 用 $env{VCPKG_ROOT} 找工具链；
#     依赖产物与源码下载目录用 actions/cache 缓存（命中后 configure 几乎瞬时）。
#   · 冒烟：无头执行 `Plugin-shot --help`（在打开日志/插件/GUI 之前就返回，
#     所以 Linux/macOS runner 不需要 X server / 显示器）。
#   · Linux 系统依赖：X11/OpenGL（glfw3 端口编译需要）+ autotools 工具链
#     （vcpkg 用 autotools 构建 dbus/libxcrypt 等）。nativefiledialog-extended 的
#     vcpkg 端口在 Linux 用 NFD_PORTAL=ON（dbus 由 vcpkg 源码构建），所以
#     libgtk-3-dev/libdbus-1-dev 不是必装项。清单按实际报错逐条补齐。
#
#  ── 可选裁剪（OpenCV 让 CI 太慢时）─────────────────────────────────────
#   在 configure 步骤追加 -DSHOT_ENABLE_OPENCV=OFF 可跳过依赖 OpenCV 的插件
#   （opencv_provider / example_processor；默认 ON，本地构建行为不变）。
#   注意：vcpkg 清单里的 opencv4 仍会安装（清单模式不支持按选项剔除依赖），
#   该开关只裁剪插件目标的编译/链接。
# ============================================================================
name: CMake CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    strategy:
      # 一个平台失败不取消其它平台：CI 结果要能同时看到 Linux/macOS/Windows。
      fail-fast: false
      matrix:
        include:
          - name: Linux / gcc / x64-linux
            os: ubuntu-latest
            platform: Linux
            triplet: x64-linux
          - name: macOS / clang / arm64-osx
            os: macos-latest
            platform: Darwin
            triplet: arm64-osx
          - name: Windows / msvc / x64-windows
            os: windows-latest
            platform: Windows
            triplet: x64-windows

    env:
      # preset（CMakePresets.json）用 $env{VCPKG_ROOT} 拼 vcpkg 工具链路径。
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DISABLE_METRICS: "1"
      # 源码构建 OpenCV 时限制并发，避免 runner 内存被并行的编译单元吃满。
      VCPKG_MAX_CONCURRENCY: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      #  1. 系统依赖
      # ---------------------------------------------------------------------
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          # 说明（按 WSL Ubuntu 24.04 + GCC13 实际构建报错逐条补齐）：
          #  · autoconf/autoconf-archive/automake/libtool/libltdl-dev/bison/flex/gperf/
          #    gettext/autopoint —— vcpkg 用 autotools 构建的移植依赖（dbus/libxcrypt 等）；
          #  · python3-venv —— libsystemd 端口在 configure 阶段要建 venv；
          #  · X11/OpenGL dev 库 —— glfw3 端口编译需要（X11/Xrandr/Xinerama/Xcursor/Xi/
          #    Xext/xkbcommon/wayland）；
          #  · nasm/yasm —— libjpeg-turbo 的 SIMD 汇编；
          #  · nativefiledialog-extended 的 vcpkg 端口在 Linux 用 NFD_PORTAL=ON，
          #    依赖由 vcpkg 自己源码构建的 dbus，所以系统 libgtk-3-dev/libdbus-1-dev
          #    实际上不是必装项（装了也无害）。
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config git curl zip unzip tar \
            autoconf autoconf-archive automake libtool libtool-bin libltdl-dev \
            bison flex gperf gettext autopoint python3-venv \
            nasm yasm \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libxext-dev libxkbcommon-dev libwayland-dev \
            libselinux1-dev libpam0g-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # macOS runner 自带 Clang / CMake；Ninja 缺失时补装。
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # preset 用 Ninja；Windows runner 通常自带，缺失时补装（Chocolatey 预装）。
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          ninja --version

      # ---------------------------------------------------------------------
      #  2. vcpkg（清单模式的底层工具）：clone 到 $VCPKG_ROOT 并 bootstrap。
      #     必须在 manifest install 之前完成，否则工具链文件不存在。
      # ---------------------------------------------------------------------
      - name: Set up vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          if [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            rm -rf "$VCPKG_ROOT"
            # 注意：不要 --depth 1 —— vcpkg 需要用 vcpkg-configuration.json 里的
            # builtin-baseline 提交号（历次 master 上的提交），浅克隆里可能没有。
            git clone --quiet https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          "$VCPKG_ROOT/vcpkg" version

      - name: Set up vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            Remove-Item -Recurse -Force "$env:VCPKG_ROOT" -ErrorAction SilentlyContinue
            git clone --quiet https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$env:VCPKG_ROOT/vcpkg.exe" version

      # ---------------------------------------------------------------------
      #  3. 缓存：已安装依赖 + 源码下载目录（放在 vcpkg 就绪之后恢复，
      #     这样 downloads 目录不会挡住 clone）。
      # ---------------------------------------------------------------------
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            build/${{ matrix.platform }}/vcpkg_installed
            ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-v1-

      # ---------------------------------------------------------------------
      #  4. 配置 + 构建（Release，Ninja）
      # ---------------------------------------------------------------------
      - name: Configure (CMake preset release)
        shell: bash
        run: |
          cmake --preset release -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET"

      - name: Build
        shell: bash
        run: |
          cmake --build --preset release

      # ---------------------------------------------------------------------
      #  5. 冒烟测试：--help 在 GUI/插件/日志初始化之前返回，可无头执行。
      # ---------------------------------------------------------------------
      - name: Smoke test (Plugin-shot --help)
        shell: bash
        run: |
          set -eux
          BIN="build/${{ matrix.platform }}/bin"
          ls -la "$BIN"
          if [ -d "$BIN/plugins" ]; then ls -la "$BIN/plugins"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$BIN/Plugin-shot.exe" --help
          else
            "./$BIN/Plugin-shot" --help
          fi
